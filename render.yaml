# render.yaml
services:
  # ─────────────────────────────────────────────────────────
  # Backend API
  # ─────────────────────────────────────────────────────────
  - type: web
    name: school-system-backend
    env: node
    region: frankfurt # or oregon / singapore — pick closest to Cameroon
    plan: starter # free tier works too
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: school-system-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        value: superadmin
      - key: SUPER_ADMIN_PASSWORD
        sync: false # You'll enter this manually in the dashboard
      - key: CORS_ORIGINS
        sync: false # Set after frontend is deployed
    disk:
      name: uploads
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1

  # ─────────────────────────────────────────────────────────
  # Database
  # ─────────────────────────────────────────────────────────
databases:
  - name: school-system-db
    databaseName: School_Management
    user: school_admin
    region: frankfurt
    plan: starter # or free tier